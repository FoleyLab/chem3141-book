# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: "CHEM 3141: Quantum Mechanics"
author: Jay Foley
logo: logo.png

exclude_patterns:
  - _build
  - Thumbs.db
  - .DS_Store
  - "**.ipynb_checkpoints"
  - CHEM_3141_PR_Spin_one_half.ipynb
  - markdown.md
  - markdown-notebooks.md
  - notebooks.ipynb
  - content/drafts/**
  - content/computational_sets/Energy_Expectation_Uncertainty.ipynb
  - content/computational_sets/images/note05.md
  - content/computational_sets/old_co2_raman.ipynb
  - content/computational_sets/two_qubit_entangled-Lindblad.ipynb
  - content/lecture_notes/Rotational_Motion_Slides.md
  - content/lecture_notes/Rotational_Motion_Slides_to_Markdown.ipynb

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: "off"

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/FoleyLab/chem3141-book  # Online location of your book
  path_to_book: ''  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

launch_buttons:
  notebook_interface: "jupyterlab"  # or "classic" if you prefer
  colab_url: https://colab.research.google.com
